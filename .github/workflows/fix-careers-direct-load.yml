name: Fix Careers Direct Load
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Careers loading
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/App.tsx')
          s = p.read_text()
          pattern = r"\n        if \(liveData\.careers\) \{.*?\n     \}\n        if \(liveData\.applications\)"
          replacement = '''
        // Careers are loaded directly from the public careers table.
        // Do not let legacy website_settings/site_settings snapshots overwrite this state.
        if (supabase && isSupabaseConfigured) {
          const { data: careersRows, error: careersLoadError } = await supabase
            .from('careers')
            .select('*')
            .order('created_at', { ascending: true });

          if (careersLoadError) {
            console.warn('[Careers] Direct careers table load failed:', careersLoadError.message);
          } else if (Array.isArray(careersRows)) {
            const mappedCareers: CareerOpportunity[] = careersRows.map((item: any) => ({
              id: item.id || '',
              title: item.title || item.job_title || '',
              type: item.type === 'internship' ? 'internship' : 'job',
              department: item.department || 'General',
              location: item.location || 'Bahawalpur, Pakistan',
              description: item.description || '',
              requirements: Array.isArray(item.requirements) ? item.requirements : [],
              benefits: Array.isArray(item.benefits)
                ? item.benefits
                : (Array.isArray(item.responsibilities) ? item.responsibilities : []),
              active: item.active ?? item.is_active ?? item.isActive ?? true
            }));
            setCareers(mappedCareers);
            dbStore.getCareers();
          }
        }
        if (liveData.applications)'''
          ns, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Careers state block not found')
          p.write_text(ns)
          PY
          git diff --check
      - name: Commit and clean up
        shell: bash
        run: |
          rm -f .github/workflows/fix-careers-direct-load.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx .github/workflows/fix-careers-direct-load.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: load careers directly from careers table'
          git push origin main
