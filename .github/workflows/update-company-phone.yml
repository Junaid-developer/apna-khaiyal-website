name: Add second company phone

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update company phone support
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text()
          def write(p,s): Path(p).write_text(s)

          # TypeScript model
          p='src/types.ts'; s=read(p)
          if 'phoneSecondary?: string;' not in s:
              s=s.replace('export interface CompanyInformation {\n  id?: string;\n  companyName: string;\n  email: string;\n  phone: string;', 'export interface CompanyInformation {\n  id?: string;\n  companyName: string;\n  email: string;\n  phone: string;\n  phoneSecondary?: string;')
          write(p,s)

          # Supabase mapping + update payload
          p='src/lib/db.ts'; s=read(p)
          s=s.replace('phone: first.phone || DEFAULT_COMPANY_INFORMATION.phone,\n', 'phone: first.phone || DEFAULT_COMPANY_INFORMATION.phone,\n        phoneSecondary: first.phone_secondary || undefined,\n')
          s=s.replace('phone: inserted.phone || DEFAULT_COMPANY_INFORMATION.phone,\n', 'phone: inserted.phone || DEFAULT_COMPANY_INFORMATION.phone,\n        phoneSecondary: inserted.phone_secondary || undefined,\n')
          s=s.replace('phone: DEFAULT_COMPANY_INFORMATION.phone || \' +92 309 0111330\',\n', 'phone: DEFAULT_COMPANY_INFORMATION.phone || \' +92 309 0111330\',\n      phone_secondary: DEFAULT_COMPANY_INFORMATION.phoneSecondary || null,\n')
          s=s.replace('phone: updatedData.phone,\n      ceo_whatsapp:', 'phone: updatedData.phone,\n      phone_secondary: updatedData.phoneSecondary ?? null,\n      ceo_whatsapp:')
          write(p,s)

          # Admin panel: save second phone and add a dedicated field
          p='src/components/AdminPanel.tsx'; s=read(p)
          old='''        phone: companyContactForm.phone,\n        address: companyContactForm.address'''
          new='''        phone: companyContactForm.phone,\n        phoneSecondary: companyContactForm.phoneSecondary || '',\n        address: companyContactForm.address'''
          if old not in s: raise SystemExit('AdminPanel save block not found')
          s=s.replace(old,new,1)

          phone_block='''                      {/* Phone Number */}\n                      <div>\n                        <label className="block text-xs font-mono text-[#CBD5E1] uppercase tracking-wider mb-2">\n                          Phone Number *\n                        </label>\n                        <input\n                          type="text"\n                          required\n                          value={companyContactForm.phone}\n                          onChange={(e) => setCompanyContactForm({ ...companyContactForm, phone: e.target.value })}\n                          className="w-full px-4 py-3 bg-[#12343b] border border-[#3f6973] focus:border-[#e1b382] rounded-xl text-sm text-white focus:outline-none transition-all"\n                          placeholder="e.g. +92 300 1234567"\n                        />\n                      </div>'''
          second='''\n\n                      {/* Second Phone Number */}\n                      <div>\n                        <label className="block text-xs font-mono text-[#CBD5E1] uppercase tracking-wider mb-2">\n                          Second Phone Number\n                        </label>\n                        <input\n                          type="text"\n                          value={companyContactForm.phoneSecondary || ''}\n                          onChange={(e) => setCompanyContactForm({ ...companyContactForm, phoneSecondary: e.target.value })}\n                          className="w-full px-4 py-3 bg-[#12343b] border border-[#3f6973] focus:border-[#e1b382] rounded-xl text-sm text-white focus:outline-none transition-all"\n                          placeholder="e.g. +92 61 1234567"\n                        />\n                      </div>'''
          if phone_block not in s: raise SystemExit('AdminPanel phone field not found')
          s=s.replace(phone_block, phone_block+second, 1)
          s=s.replace('Company Name, Email, Phone, and Address are managed exclusively', 'Company Name, Email, Phone, Second Phone, and Address are managed exclusively')
          write(p,s)

          # Footer: render each phone on its own line
          p='src/components/Footer.tsx'; s=read(p)
          s=s.replace("  const displayPhone = activeInfo?.phone || settings?.phone || '+92 309 0111330';\n", "  const displayPhone = activeInfo?.phone || settings?.phone || '+92 309 0111330';\n  const displayPhoneSecondary = activeInfo?.phoneSecondary || '';\n")
          old='''              <div className="flex items-center">\n                <Phone className="w-4 h-4 text-[#E7C66A] shrink-0 mr-3" />\n                <a \n                  href={footerTelHref} \n                  id="footer-phone" \n                  className="text-[#CBD5E1] hover:text-[#E7C66A] hover:underline transition-colors cursor-pointer break-all xs:break-normal"\n                  title="Click to dial company phone number"\n                >\n                  {rawPhone}\n                </a>\n              </div>'''
          new='''              <div className="flex items-start">\n                <Phone className="w-4 h-4 text-[#E7C66A] shrink-0 mr-3 mt-1" />\n                <div className="flex flex-col gap-1.5 min-w-0">\n                  <a \n                    href={footerTelHref} \n                    id="footer-phone" \n                    className="text-[#CBD5E1] hover:text-[#E7C66A] hover:underline transition-colors cursor-pointer break-all xs:break-normal"\n                    title="Click to dial company phone number"\n                  >\n                    {rawPhone}\n                  </a>\n                  {displayPhoneSecondary && (() => {\n                    const secondaryDigits = displayPhoneSecondary.replace(/[^\\d+]/g, '');\n                    const secondaryHref = secondaryDigits.startsWith('+') ? `tel:${secondaryDigits}` : `tel:+${secondaryDigits}`;\n                    return (\n                      <a\n                        href={secondaryHref}\n                        id="footer-phone-2"\n                        className="text-[#CBD5E1] hover:text-[#E7C66A] hover:underline transition-colors cursor-pointer break-all xs:break-normal"\n                        title="Click to dial company phone number"\n                      >\n                        {displayPhoneSecondary}\n                      </a>\n                    );\n                  })()}\n                </div>\n              </div>'''
          if old not in s: raise SystemExit('Footer phone block not found')
          s=s.replace(old,new,1)
          write(p,s)

          # Contact page: use the two structured phone fields, one per line
          p='src/components/ContactView.tsx'; s=read(p)
          old='''  const phoneNumbers = displayPhone\n    .split(/[\\n,;]+|(?<=\\d)\\s+(?=[+\\d])/g)\n    .map((phone) => phone.trim())\n    .filter(Boolean)\n    .map((phone) => phone.includes('3001234567') ? '+92 309 0111330' : phone);'''
          new='''  const phoneNumbers = [displayPhone, activeInfo?.phoneSecondary || '']\n    .flatMap((phone) => phone.split(/[\\n,;]+/))\n    .map((phone) => phone.trim())\n    .filter(Boolean)\n    .map((phone) => phone.includes('3001234567') ? '+92 309 0111330' : phone);'''
          if old not in s: raise SystemExit('ContactView phone parsing block not found')
          s=s.replace(old,new,1)
          write(p,s)

          # Remove this one-shot workflow after applying the changes.
          wf=Path('.github/workflows/update-company-phone.yml')
          wf.unlink()
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.ts src/lib/db.ts src/components/AdminPanel.tsx src/components/Footer.tsx src/components/ContactView.tsx .github/workflows/update-company-phone.yml
          git commit -m "Add separate second company phone number" || exit 0
          git push
