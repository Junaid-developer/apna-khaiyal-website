name: Ensure Application Persistence
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'fix: application persistence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix application add/delete state flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/App.tsx')
          s = p.read_text()

          add_pattern = r"\s*const handleAddApplication = async \(newApp: JobApplication\) => \{.*?\n\s*\};"
          add_replacement = '''
  const handleAddApplication = async (newApp: JobApplication) => {
    const savedApp = await dbStore.addApplication(newApp);
    setApplications(prev => [savedApp, ...prev.filter(existing => existing.id !== savedApp.id)]);
  };'''
          s, count = re.subn(add_pattern, add_replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate handleAddApplication')

          save_pattern = r"\s*const handleSaveApplications = async \(data: JobApplication\[\]\) => \{.*?\n\s*\};"
          save_replacement = '''
  const handleSaveApplications = async (data: JobApplication[]) => {
    const nextIds = new Set(data.map(item => item?.id).filter(Boolean));
    const removedIds = applications
      .map(item => item?.id)
      .filter((id): id is string => Boolean(id) && !nextIds.has(id));

    if (removedIds.length) {
      await dbStore.deleteApplications(removedIds);
    }

    setApplications(data);
  };'''
          s, count = re.subn(save_pattern, save_replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate handleSaveApplications')

          old_sync = """          // Never wipe locally loaded applications when Supabase returns an empty/temporary response.
          if (normApps.length > 0) {
            setApplications(normApps);
          }"""
          new_sync = """          // Supabase is authoritative for applications. An empty result means all applications were deleted.
          setApplications(normApps);"""
          if old_sync in s:
              s = s.replace(old_sync, new_sync, 1)
          p.write_text(s)

          # Clear stale application cache at the source. Supabase is authoritative;
          # an empty database must render as zero applications after a hard refresh.
          p = Path('src/lib/db.ts')
          s = p.read_text()
          old = "getApplications: () => legacy.isSupabaseConfigured ? readLocalList<JobApplication>(APPLICATIONS_CACHE_KEY) : legacy.dbStore.getApplications(),"
          new = "getApplications: () => legacy.isSupabaseConfigured ? [] : legacy.dbStore.getApplications(),"
          if old in s:
              s = s.replace(old, new, 1)
          else:
              print('getApplications source already patched or not found')
          p.write_text(s)
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/lib/db.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix: application persistence'
          git push
