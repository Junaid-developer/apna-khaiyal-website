name: Ensure Application Single Write
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'fix: application single write'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/App.tsx')
          s = p.read_text()
          pattern = r"\s*const handleAddApplication = async \(newApp: JobApplication\) => \{.*?\n\s*\};"
          replacement = '''
  // Persist exactly one public application, then append the persisted record to UI state.
  // Do not replace the full application collection and do not perform a second write.
  const handleAddApplication = async (newApp: JobApplication) => {
    const savedApp = await dbStore.addApplication(newApp);
    setApplications(prev => [savedApp, ...prev.filter(existing => existing.id !== savedApp.id)]);
  };'''
          s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate handleAddApplication')
          p.write_text(s2)
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: application single write'
          git push
