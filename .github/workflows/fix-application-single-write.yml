name: Fix Application Single Write
on:
  push:
    paths:
      - '.github/workflows/fix-application-single-write.yml'
      - '.github/workflows/trigger-single-write.txt'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = """  const handleAddApplication = (newApp: JobApplication) => {\n    const updated = [newApp, ...applications];\n    handleSaveApplications(updated);\n  };"""
          new = """  const handleAddApplication = async (newApp: JobApplication) => {\n    // Applications are append-only. Write only the new row to Supabase so a\n    // stale React array can never overwrite or hide previously submitted rows.\n    await dbStore.saveApplications([newApp]);\n    setApplications(prev => [newApp, ...prev]);\n  };"""
          if old not in s:
              raise SystemExit('handleAddApplication block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'fix: write each job application independently'
          git push
          git rm -f .github/workflows/fix-application-single-write.yml .github/workflows/trigger-single-write.txt || true
          git commit -m 'chore: remove one-time application writer workflow' || true
          git push || true
