name: Fix product image persistence

on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch product image persistence
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/db.ts')
          s = p.read_text()
          old = """        const imageList = prod.productImages && prod.productImages.length > 0
          ? prod.productImages
          : (prod.images && prod.images.length > 0
              ? prod.images
              : [prod.image, ...(prod.gallery || [])].filter(Boolean));"""
          new = """        // Prefer the freshly edited string[] from the product editor.
        // productImages can contain stale relational rows from before an edit.
        const imageList = prod.images && prod.images.length > 0
          ? prod.images
          : (prod.gallery && prod.gallery.length > 0
              ? [prod.image, ...(prod.gallery || [])].filter(Boolean)
              : (prod.productImages && prod.productImages.length > 0
                  ? prod.productImages
                  : [prod.image].filter(Boolean)));"""
          if old not in s:
              raise SystemExit('Target imageList block not found; refusing unsafe patch')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/db.ts
          git commit -m "fix: persist all edited product images" || exit 0
          git push
