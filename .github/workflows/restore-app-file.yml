name: Restore App File
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor == 'github-actions[bot]' || contains(github.event.head_commit.message, 'Restore App.tsx')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore App.tsx
        run: |
          git checkout fcc2f910717323309444d5390fba75fd834929a2 -- src/App.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --quiet || git commit -m 'Restore App.tsx'
          git push
