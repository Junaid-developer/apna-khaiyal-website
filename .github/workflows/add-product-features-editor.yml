name: Rollback Product Save Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rollback-bad-save-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Roll back the bad product save patch once
        shell: bash
        run: |
          if grep -q "Explicitly map ProductItem to the products table" src/lib/db.ts; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git revert --no-edit 6486bb4da114db1bfba22b72f1eea6d3dc5c442f
            git push
          else
            echo 'Bad product save patch is already rolled back. No action needed.'
          fi
