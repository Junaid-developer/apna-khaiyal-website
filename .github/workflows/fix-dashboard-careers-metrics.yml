name: Fix dashboard careers metrics
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Fix dashboard careers metrics')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch DashboardOverview.tsx
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/DashboardOverview.tsx')
          s = p.read_text()
          s = s.replace("  const safeCareers = Array.isArray(liveMetrics?.rawCareers) \n    ? liveMetrics.rawCareers \n    : (Array.isArray(careers) ? careers : []);", "  // Careers and applications must follow the authoritative App state.\n  // Dashboard analytics cache must never resurrect deleted records.\n  const safeCareers = Array.isArray(careers) ? careers : [];")
          s = s.replace("  const safeApplications =\n    Array.isArray(liveMetrics?.rawJobApplications) && liveMetrics.rawJobApplications.length > 0\n      ? liveMetrics.rawJobApplications\n      : (Array.isArray(applications) ? applications : []);", "  const safeApplications = Array.isArray(applications) ? applications : [];")
          s = s.replace("  const totalCareers = typeof liveMetrics?.totalCareers === 'number' ? liveMetrics.totalCareers : safeCareers.length;", "  const totalCareers = safeCareers.length;")
          s = s.replace("  const totalJobApplications = typeof liveMetrics?.totalJobApplications === 'number' ? liveMetrics.totalJobApplications : safeApplications.length;", "  const totalJobApplications = safeApplications.length;")
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/DashboardOverview.tsx
          git commit -m 'Apply dashboard careers metrics fix' || exit 0
          git push
