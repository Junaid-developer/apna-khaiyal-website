name: Direct Careers Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal Careers sync fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/db.ts')
          s = p.read_text()

          marker = """      if (normalizedCareersList.length === 0) {\n        try {\n          const { data: setRow } = await supabase.from('website_settings').select('value').eq('key', 'careers').maybeSingle();"""

          replacement = """      // Careers are saved by the Admin Panel as a complete merged array in website_settings.\n      // Prefer that authoritative snapshot over a potentially stale/partial dedicated-table read.\n      try {\n        const { data: setRow } = await supabase.from('website_settings').select('value').eq('key', 'careers').maybeSingle();\n        if (setRow && Array.isArray((setRow as any).value) && (setRow as any).value.length > 0) {\n          normalizedCareersList = (setRow as any).value;\n        } else if (normalizedCareersList.length === 0) {\n          const { data: siteSetRow } = await supabase.from('site_settings').select('value').eq('key', 'careers').maybeSingle();\n          if (siteSetRow && Array.isArray((siteSetRow as any).value) && (siteSetRow as any).value.length > 0) {\n            normalizedCareersList = (siteSetRow as any).value;\n          }\n        }\n      } catch (careersFallbackErr) {\n        console.warn('[Supabase Sync] careers settings fallback notice:', careersFallbackErr);\n      }\n\n      /* legacy fallback retained below only when the authoritative snapshot is unavailable */\n      if (normalizedCareersList.length === 0) {\n        try {\n          const { data: setRow } = await supabase.from('website_settings').select('value').eq('key', 'careers').maybeSingle();"""

          if marker not in s:
              raise SystemExit('Expected careers fallback marker not found; refusing to modify source.')
          s = s.replace(marker, replacement, 1)

          p.write_text(s)
          PY
          git diff --check

      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/fix-careers-direct.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/db.ts .github/workflows/fix-careers-direct.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Careers data overwrite on refresh"
          git push