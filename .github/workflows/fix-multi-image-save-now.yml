name: Fix multi-image product save

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-multi-image-save-now.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch local persistence safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/lib/db.ts')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'const setStored = <T>\(key: string, value: T\) => \{.*?\n\};', re.S)
          replacement = '''const setStored = <T>(key: string, value: T) => {
  try {
    localStorage.setItem(`apnakhaiyal_${key}`, JSON.stringify(value));
  } catch (error: any) {
    // Large/multiple product images must not abort the Save Product form.
    // Remote Supabase persistence is attempted separately by saveProducts.
    console.warn(`[localStorage] Could not persist ${key}; continuing:`, error?.message || error);
  }
};'''
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('Could not locate setStored block; refusing unsafe patch')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          grep -A9 -B1 'const setStored' src/lib/db.ts
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/db.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Fix multi-image product save persistence'
          git push