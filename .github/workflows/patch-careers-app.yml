name: Patch Careers App Sync
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Patch Careers App Sync')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App.tsx
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = '''        if (liveData.careers) {
          const normCareers = Array.isArray(liveData.careers)
          ? liveData.careers
          : (liveData.careers && typeof liveData.careers === 'object'
           ? [liveData.careers]
           : []);
       if (normCareers.length > 0) {
         setCareers(normCareers);
       }
     }
        if (liveData.applications) {
          const normApps = Array.isArray(liveData.applications)
            ? liveData.applications
            : (liveData.applications && typeof liveData.applications === 'object' ? [liveData.applications] : []);
          // Never wipe locally loaded applications when Supabase returns an empty/temporary response.
          if (normApps.length > 0) {
            setApplications(normApps);
          }
        }'''
          new = '''        if (liveData.careers !== undefined) {
          const normCareers = Array.isArray(liveData.careers)
            ? liveData.careers
            : (liveData.careers && typeof liveData.careers === 'object' ? [liveData.careers] : []);
          // Empty Supabase careers is authoritative; do not resurrect old local/default jobs.
          setCareers(normCareers);
        }
        if (liveData.applications !== undefined) {
          const normApps = Array.isArray(liveData.applications)
            ? liveData.applications
            : (liveData.applications && typeof liveData.applications === 'object' ? [liveData.applications] : []);
          // Empty Supabase applications is authoritative too.
          setApplications(normApps);
        }'''
          if old not in s:
              raise SystemExit('Expected Careers sync block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'Apply Careers App empty-state sync' || exit 1
          git push
