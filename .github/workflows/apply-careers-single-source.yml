name: Careers Final Fix
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch App.tsx
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/App.tsx')
          s = p.read_text()
          pattern = r"\n        if \(liveData\.careers\) \{.*?\n     \}\n        if \(liveData\.applications\)"
          replacement = '''
        // Careers are read directly from public.careers. Legacy settings mirrors
        // must never overwrite the authoritative careers state.
        if (supabase && isSupabaseConfigured) {
          const { data: careersRows, error: careersLoadError } = await supabase
            .from('careers')
            .select('*')
            .order('created_at', { ascending: true });

          if (careersLoadError) {
            console.warn('[Careers] Direct careers load failed:', careersLoadError.message);
          } else if (Array.isArray(careersRows)) {
            const mappedCareers: CareerOpportunity[] = careersRows.map((item: any) => ({
              id: item.id || '',
              title: item.title || item.job_title || '',
              type: item.type === 'internship' ? 'internship' : 'job',
              department: item.department || 'General',
              location: item.location || 'Bahawalpur, Pakistan',
              description: item.description || '',
              requirements: Array.isArray(item.requirements) ? item.requirements : [],
              benefits: Array.isArray(item.benefits)
                ? item.benefits
                : (Array.isArray(item.responsibilities) ? item.responsibilities : []),
              active: item.active ?? item.is_active ?? item.isActive ?? true
            }));
            setCareers(mappedCareers);
          }
        }
        if (liveData.applications)'''
          ns, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Careers block not found')
          p.write_text(ns)
          PY
          git diff --check
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: careers direct load'
          git push origin main
