name: One-time Home Products Speed Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-home-products-loading:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove blocking Home Products skeleton
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')
          marker = '/* Slider Core Frame */'
          if marker not in s:
              raise SystemExit('Slider Core Frame marker not found')
          before, after = s.split(marker, 1)
          old = 'if (isDataLoading) {'
          if old not in after:
              raise SystemExit('Home products loading condition not found')
          after = after.replace(old, 'if (false) {', 1)
          p.write_text(before + marker + after, encoding='utf-8')
          PY

      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git rm .github/workflows/one-time-home-products-speed-fix.yml
          git commit -m "Fix slow Home featured products loading"
          git push
