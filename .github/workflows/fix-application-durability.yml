name: Fix Application Durability
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'fix: make applications durable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch application durability
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Missing expected text in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace('src/App.tsx',
            """  const handleSaveApplications = (data: JobApplication[]) => {\n    setApplications(data);\n    dbStore.saveApplications(data);\n  };""",
            """  const handleSaveApplications = async (data: JobApplication[]) => {\n    await dbStore.saveApplications(data);\n    setApplications(data);\n  };""")

          replace('src/App.tsx',
            """  const handleAddApplication = (newApp: JobApplication) => {\n    const updated = [newApp, ...applications];\n    handleSaveApplications(updated);\n  };""",
            """  const handleAddApplication = async (newApp: JobApplication) => {\n    const updated = [newApp, ...applications];\n    await handleSaveApplications(updated);\n  };""")

          replace('src/components/CareersView.tsx',
            """import { CareerOpportunity, JobApplication } from '../types';""",
            """import { CareerOpportunity, JobApplication } from '../types';\nimport { uploadImageToSupabase } from '../lib/supabase';""")

          replace('src/components/CareersView.tsx',
            """  onAddApplication: (app: JobApplication) => void;""",
            """  onAddApplication: (app: JobApplication) => void | Promise<void>;""")

          replace('src/components/CareersView.tsx',
            """  const [resumeBase64, setResumeBase64] = useState('');\n  const [isDragging, setIsDragging] = useState(false);""",
            """  const [resumeBase64, setResumeBase64] = useState('');\n  const [resumeFile, setResumeFile] = useState<File | null>(null);\n  const [isDragging, setIsDragging] = useState(false);""")

          replace('src/components/CareersView.tsx',
            """  const processFile = (file: File) => {\n    if (!file) return;""",
            """  const processFile = (file: File) => {\n    if (!file) return;\n    setResumeFile(file);""")

          replace('src/components/CareersView.tsx',
            """    setResumeName('');\n    setResumeBase64('');\n  };""",
            """    setResumeName('');\n    setResumeBase64('');\n    setResumeFile(null);\n  };""")

          replace('src/components/CareersView.tsx',
            """  const handleFormSubmit = (e: FormEvent) => {\n    e.preventDefault();""",
            """  const handleFormSubmit = async (e: FormEvent) => {\n    e.preventDefault();""")

          replace('src/components/CareersView.tsx',
            """    const newApp: JobApplication = {\n      id: crypto.randomUUID(),\n      jobId: selectedJob?.id || 'general',\n      jobTitle: selectedJob?.title || 'General Application',\n      fullName,\n      email,\n      phone,\n      resumeUrl: resumeBase64, // Storing base64 as mock url\n      coverLetter,\n      appliedAt: new Date().toISOString()\n    };\n\n    onAddApplication(newApp);\n    setFormSubmitted(true);\n    setFormError('');""",
            """    try {\n      let resumeUrl = resumeBase64;\n      if (resumeFile) {\n        resumeUrl = await uploadImageToSupabase(resumeFile, 'documents');\n        if (resumeUrl.startsWith('data:')) {\n          throw new Error('Resume upload failed. Please try again.');\n        }\n      }\n\n      const newApp: JobApplication = {\n        id: crypto.randomUUID(),\n        jobId: selectedJob?.id || 'general',\n        jobTitle: selectedJob?.title || 'General Application',\n        fullName,\n        email,\n        phone,\n        resumeUrl,\n        coverLetter,\n        appliedAt: new Date().toISOString()\n      };\n\n      await onAddApplication(newApp);\n      setFormSubmitted(true);\n      setFormError('');\n    } catch (error: any) {\n      console.error('[Careers] Application submission failed:', error);\n      setFormError(error?.message || 'Unable to submit your application right now. Please try again.');\n    }""")

      - name: Verify and commit
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/components/CareersView.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make applications durable'
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm -f .github/workflows/fix-application-durability.yml || true
          git commit -m 'chore: remove application durability fixer' || true
          git push || true
