name: Fix careers persistence

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/lib/db.ts')
          s=p.read_text()
          start=s.index("  getCareers: (): CareerOpportunity[] => getStored('careers', DEFAULT_CAREERS),")
          end=s.index("  getApplications:", start)
          new="""  getCareers: (): CareerOpportunity[] => getStored('careers', DEFAULT_CAREERS),
  saveCareers: async (items: CareerOpportunity[]) => {
    const careers = Array.isArray(items) ? items : [];
    setStored('careers', careers);
    if (!supabase) return careers;
    try {
      const { data: rows } = await supabase.from('careers').select('id');
      const existingIds = (rows || []).map((r: any) => r.id).filter(Boolean);
      const incomingIds = careers.map((j: any) => j?.id).filter(Boolean);
      const incomingSet = new Set(incomingIds);
      const idsToDelete = existingIds.filter((id: string) => !incomingSet.has(id));
      if (idsToDelete.length) {
        const { error } = await supabase.from('careers').delete().in('id', idsToDelete);
        if (error) throw error;
      }
      if (careers.length) {
        const dbRows = careers.map((job: any) => ({
          id: job.id, title: job.title || '', type: job.type || 'job',
          department: job.department || 'General', location: job.location || '',
          description: job.description || '',
          requirements: Array.isArray(job.requirements) ? job.requirements : [],
          responsibilities: Array.isArray(job.responsibilities) ? job.responsibilities : [],
          experience: job.experience || '', is_active: job.active !== false,
          active: job.active !== false, isActive: job.active !== false
        }));
        const { error } = await supabase.from('careers').upsert(dbRows, { onConflict: 'id' });
        if (error) throw error;
      }
      await saveWebsiteSetting('careers', careers);
    } catch (e) { console.warn('[Careers] persistence:', e); }
    return careers;
  },
"""
          s=s[:start]+new+s[end:]
          start=s.index("  getApplications:")
          m=re.search(r"  getApplications:[\\s\\S]*?\n  },(?=\n  [A-Za-z_]+:)",s[start:])
          if not m: raise SystemExit('applications block not found')
          apps="""  getApplications: (): JobApplication[] => getStored('applications', []),
  saveApplications: async (items: JobApplication[]) => {
    const applications = Array.isArray(items) ? items : [];
    setStored('applications', applications);
    if (!supabase) return applications;
    try {
      const { data: rows } = await supabase.from('job_applications').select('id');
      const existingIds = (rows || []).map((r: any) => r.id).filter(Boolean);
      const incomingIds = applications.map((a: any) => a?.id).filter(Boolean);
      const incomingSet = new Set(incomingIds);
      const idsToDelete = existingIds.filter((id: string) => !incomingSet.has(id));
      if (idsToDelete.length) {
        const { error } = await supabase.from('job_applications').delete().in('id', idsToDelete);
        if (error) throw error;
      }
      if (applications.length) await syncTableToSupabase('job_applications', applications);
    } catch (e) { console.warn('[Applications] persistence:', e); }
  },"""
          s=s[:start]+apps+s[start+m.end():]
          p.write_text(s)
          PY
          grep -n "idsToDelete" src/lib/db.ts
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/db.ts
          if git diff --cached --quiet; then echo 'NO SOURCE CHANGE'; exit 1; fi
          git commit -m 'fix permanent careers and applications deletion'
          git push