name: Finalize Careers persistence fix
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final Careers persistence fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib/db.ts')
          s = p.read_text()

          old_save = """  saveCareers: (items: CareerOpportunity[]) => {
    setStored('careers', items);
    // Careers are stored in the dedicated careers table as the primary source of truth.
    // Keep website_settings as a backward-compatible mirror for older deployments.
    syncTableToSupabase('careers', items);
    saveWebsiteSetting('careers', items);
  },"""
          new_save = """  saveCareers: (items: CareerOpportunity[]) => {
    setStored('careers', items);
    // Careers use website_settings/site_settings as the durable source of truth.
    // The legacy careers table schema is incompatible with CareerOpportunity and must not
    // participate in writes, because its failed upsert can leave refresh data inconsistent.
    saveWebsiteSetting('careers', items);
  },"""
          if old_save not in s:
              raise SystemExit('saveCareers block not found')
          s = s.replace(old_save, new_save, 1)

          old_read = """      // The dedicated `careers` table's column schema (is_active/responsibilities/experience)
      // does not match the fields the Admin Panel writes (active/benefits), so admin saves of
      // new/edited jobs land reliably in `website_settings` (key: 'careers') but not always in
      // this table. Treat an empty/errored `careers` table read as inconclusive and fall back to
      // the website_settings / site_settings mirror (and finally local storage) instead of
      // treating \"no rows from this table\" as \"no careers exist\" — this is what was overwriting
      // saved jobs with stale/empty data on refresh.
      if (normalizedCareersList.length === 0) {
        try {
          const { data: setRow } = await supabase.from('website_settings').select('value').eq('key', 'careers').maybeSingle();
          if (setRow && Array.isArray((setRow as any).value) && (setRow as any).value.length > 0) {
            normalizedCareersList = (setRow as any).value;
          } else {
            const { data: siteSetRow } = await supabase.from('site_settings').select('value').eq('key', 'careers').maybeSingle();
            if (siteSetRow && Array.isArray((siteSetRow as any).value) && (siteSetRow as any).value.length > 0) {
              normalizedCareersList = (siteSetRow as any).value;
            }
          }
        } catch (careersFallbackErr) {
          console.warn('[Supabase Sync] careers website_settings fallback notice:', careersFallbackErr);
        }
      }
"""
          new_read = """      // Careers are durably stored by saveCareers() in website_settings/site_settings.
      // Always prefer that JSON source when it contains an array. The legacy careers table
      // has a different schema and can be empty/stale, so allowing it to win causes saved jobs
      // to disappear after refresh.
      try {
        const { data: setRow, error: setErr } = await supabase.from('website_settings').select('value').eq('key', 'careers').maybeSingle();
        if (!setErr && setRow && Array.isArray((setRow as any).value)) {
          normalizedCareersList = (setRow as any).value;
        } else {
          const { data: siteSetRow, error: siteSetErr } = await supabase.from('site_settings').select('value').eq('key', 'careers').maybeSingle();
          if (!siteSetErr && siteSetRow && Array.isArray((siteSetRow as any).value)) {
            normalizedCareersList = (siteSetRow as any).value;
          }
        }
      } catch (careersFallbackErr) {
        console.warn('[Supabase Sync] careers website_settings fallback notice:', careersFallbackErr);
      }
"""
          if old_read not in s:
              raise SystemExit('careers read block not found')
          s = s.replace(old_read, new_read, 1)
          p.write_text(s)
      - name: Verify scope
        shell: bash
        run: |
          git diff -- src/lib/db.ts
          git diff --check
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-careers-persistence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/db.ts .github/workflows/fix-careers-persistence.yml
          git commit -m "Fix Careers persistence source of truth"
          git push
