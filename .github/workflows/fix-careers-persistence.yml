name: Finalize Careers persistence fix
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final Careers persistence fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/db.ts')
          s = p.read_text()

          old = "syncTableToSupabase('careers', items);\n    saveWebsiteSetting('careers', items);"
          new = "saveWebsiteSetting('careers', items);"
          if old not in s:
              raise SystemExit('saveCareers write block not found')
          s = s.replace(old, new, 1)

          old = "if (normalizedCareersList.length === 0) {"
          new = "if (true) {"
          if old not in s:
              raise SystemExit('careers fallback condition not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Verify
        run: git diff --check
      - name: Commit fix and clean up
        shell: bash
        run: |
          rm -f .github/workflows/fix-careers-persistence.yml CAREERS_FIX_TRIGGER.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/db.ts .github/workflows/fix-careers-persistence.yml CAREERS_FIX_TRIGGER.md
          git diff --cached --quiet && exit 0
          git commit -m "Fix Careers persistence source of truth"
          git push
