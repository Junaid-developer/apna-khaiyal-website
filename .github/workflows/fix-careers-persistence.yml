name: Fix careers persistence
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch careers persistence
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib/db.ts')
          s = p.read_text()
          old = """  saveCareers: (items: CareerOpportunity[]) => {\n    setStored('careers', items);\n    saveWebsiteSetting('careers', items);\n  },"""
          new = """  saveCareers: (items: CareerOpportunity[]) => {\n    setStored('careers', items);\n    // Careers are stored in the dedicated careers table as the primary source of truth.\n    // Keep website_settings as a backward-compatible mirror for older deployments.\n    syncTableToSupabase('careers', items);\n    saveWebsiteSetting('careers', items);\n  },"""
          if old not in s:
              raise SystemExit('saveCareers block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/db.ts
          git diff --cached --quiet && exit 0
          git commit -m "Fix careers persistence on refresh"
          git push
