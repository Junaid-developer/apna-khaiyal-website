name: Fix Careers race condition
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted App careers race fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = '''  useEffect(() => {
    const initSync = async () => {
      setIsDataLoading(true);
      const liveData = await syncAllFromSupabase();
      if (liveData) {'''
          new = '''  useEffect(() => {
    let cancelled = false;

    const initSync = async () => {
      setIsDataLoading(true);
      const liveData = await syncAllFromSupabase();
      if (liveData && !cancelled) {'''
          if old not in s:
              raise SystemExit('initSync start block not found')
          s = s.replace(old, new, 1)

          old2 = '''      setIsDataLoading(false);
    };
    initSync();
  }, []);'''
          new2 = '''      if (!cancelled) setIsDataLoading(false);
    };
    void initSync();

    return () => {
      cancelled = true;
    };
  }, []);'''
          if old2 not in s:
              raise SystemExit('initSync cleanup block not found')
          s = s.replace(old2, new2, 1)

          p.write_text(s)
          PY
      - name: Verify diff
        run: git diff --check
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-careers-race.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/fix-careers-race.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix Careers async refresh race"
          git push origin main
