name: Repair content fallbacks

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repair safe fallback behavior
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          # Never replace working local/default content with an empty Supabase result.
          p = 'src/lib/db.ts'
          s = read(p)
          replacements = [
              ("      if (Array.isArray(stored) && stored.length > 0) rawProducts = stored;\n", "      if (Array.isArray(stored) && stored.length > 0) rawProducts = stored;\n      else rawProducts = DEFAULT_PRODUCTS;\n"),
              ("          if (Array.isArray(stored) && stored.length > 0) rawServices = stored;\n", "          if (Array.isArray(stored) && stored.length > 0) rawServices = stored;\n          else rawServices = DEFAULT_SERVICES;\n"),
              ("      if (Array.isArray(stored) && stored.length > 0) rawHeroSlides = stored;\n", "      if (Array.isArray(stored) && stored.length > 0) rawHeroSlides = stored;\n      else rawHeroSlides = DEFAULT_HERO_SLIDES;\n"),
              ("      if (Array.isArray(stored) && stored.length > 0) rawGallery = stored;\n", "      if (Array.isArray(stored) && stored.length > 0) rawGallery = stored;\n      else rawGallery = DEFAULT_GALLERY;\n"),
              ("      if (Array.isArray(stored) && stored.length > 0) rawTeam = stored;\n", "      if (Array.isArray(stored) && stored.length > 0) rawTeam = stored;\n      else rawTeam = DEFAULT_TEAM;\n"),
          ]
          for old, new in replacements:
              if old in s and new not in s:
                  s = s.replace(old, new, 1)
          write(p, s)

          # App state must also refuse to overwrite a good local/default array with [].
          p = 'src/App.tsx'
          s = read(p)
          array_fields = [
              'heroSlides', 'services', 'products', 'team', 'gallery', 'reviews',
              'careers', 'applications', 'messages', 'expertise', 'process',
              'industries', 'techStack'
          ]
          for field in array_fields:
              old = f"        if (liveData.{field}) set"
              if old in s:
                  # Handle the normal setter names used in this file.
                  setter = {
                      'heroSlides':'setHeroSlides','services':'setServices','products':'setProducts','team':'setTeam',
                      'gallery':'setGallery','reviews':'setReviews','careers':'setCareers','applications':'setApplications',
                      'messages':'setMessages','expertise':'setExpertise','process':'setProcessItems',
                      'industries':'setIndustryItems','techStack':'setTechStackItems'
                  }[field]
                  exact = f"        if (liveData.{field}) {setter}(liveData.{field});"
                  safe = f"        if (Array.isArray(liveData.{field}) && liveData.{field}.length > 0) {setter}(liveData.{field});"
                  s = s.replace(exact, safe, 1)
          write(p, s)

          # Featured product images: use gallery image when a legacy product has no primary image.
          p = 'src/App.tsx'
          s = read(p)
          s = s.replace('src={currentProd.image}\n', "src={currentProd.image || currentProd.gallery?.[0] || 'https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=1200&auto=format&fit=crop'}\n", 1)
          write(p, s)

          # Product grid gets the same safe image fallback.
          p = 'src/components/ProductsView.tsx'
          s = read(p)
          s = s.replace("const getProductDashboardImage = (name: string, customImg?: string) => customImg?.trim() || '';", "const getProductDashboardImage = (name: string, customImg?: string, gallery?: string[]) => customImg?.trim() || gallery?.find(Boolean) || '';", 1)
          s = s.replace('getProductDashboardImage(prod.name, prod.image)', 'getProductDashboardImage(prod.name, prod.image, prod.gallery)', 1)
          write(p, s)

          # Remove this one-shot workflow after applying the repairs.
          wf = Path('.github/workflows/repair-content-fallbacks.yml')
          wf.unlink()
          PY

      - name: Commit repaired files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/db.ts src/App.tsx src/components/ProductsView.tsx .github/workflows/repair-content-fallbacks.yml
          git commit -m "Repair content fallbacks and featured product images" || exit 0
          git push
