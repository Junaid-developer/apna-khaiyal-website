name: Fix About persistence v3

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch About persistence
        shell: python
        run: |
          from pathlib import Path
          import re
          db=Path('src/lib/db.ts'); text=db.read_text(encoding='utf-8')
          p=re.compile(r"  getAbout: \(\): AboutData => getStored\('about', DEFAULT_ABOUT\),\n  saveAbout: \(data: AboutData\) => \{\n    setStored\('about', data\);\n    saveWebsiteSetting\('about', data\);\n  \},")
          r="""  getAbout: (): AboutData => getStored('about', DEFAULT_ABOUT),
  saveAbout: async (data: AboutData) => {
    setStored('about', data);
    if (!supabase) return;
    const now = new Date().toISOString();
    try {
      const { error: e1 } = await supabase.from('website_settings').upsert({ key:'about', value:data, updated_at:now }, { onConflict:'key' });
      if (e1) throw e1;
      const { error: e2 } = await supabase.from('site_settings').upsert({ key:'about', value:data, updated_at:now }, { onConflict:'key' });
      if (e2) throw e2;
      const { data:v, error:e3 } = await supabase.from('website_settings').select('value').eq('key','about').maybeSingle();
      if (e3) throw e3;
      if (v?.value) setStored('about', v.value as AboutData);
    } catch (error) { console.error('[saveAbout] Supabase persistence failed:', error); throw error; }
  },"""
          if not p.search(text): raise SystemExit('Expected About save block not found')
          db.write_text(p.sub(r,text,count=1),encoding='utf-8')
          app=Path('src/App.tsx'); text=app.read_text(encoding='utf-8')
          p=re.compile(r"  const handleSaveAbout = \(data: AboutData\) => \{\n    setAbout\(data\);\n    dbStore\.saveAbout\(data\);\n  \};")
          r="""  const handleSaveAbout = async (data: AboutData) => {
    await dbStore.saveAbout(data);
    setAbout(data);
  };"""
          if not p.search(text): raise SystemExit('Expected App About save block not found')
          app.write_text(p.sub(r,text,count=1),encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/db.ts src/App.tsx
          if git diff --cached --quiet; then echo "No changes needed"; exit 0; fi
          git commit -m "fix: persist About edits reliably"
          git push
