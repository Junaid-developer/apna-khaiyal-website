name: Fix careers load
on:
  push:
    branches: [fix/careers-persistence]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch careers fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/db.ts')
          s = p.read_text()
          old = "      if (true) {\n        try {"
          new = "      if (normalizedCareersList.length === 0) {\n        try {"
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/db.ts
          git commit -m 'Fix careers refresh state overwrite' || exit 0
          git push
