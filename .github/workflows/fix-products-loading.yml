name: Fix Products Loading

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-products-loading-trigger.txt'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch App product loading
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.tsx')
          source = p.read_text()
          old = """        if (Array.isArray(liveData.products) && liveData.products.length > 0) setProducts(liveData.products);"""
          new = """        if (Array.isArray(liveData.products) && liveData.products.length > 0) setProducts(liveData.products);

        // Products are authoritative in public.products. Bypass role-filtered CMS snapshots
        // for the public product list so every DB product is shown consistently on refresh.
        if (supabase && isSupabaseConfigured) {
          try {
            const { data: directProducts, error: directProductsError } = await supabase
              .from('products')
              .select('*');
            const { data: directProductImages } = await supabase
              .from('product_images')
              .select('*')
              .order('display_order', { ascending: true });

            if (!directProductsError && Array.isArray(directProducts)) {
              const imagesByProductId: Record<string, any[]> = {};
              (directProductImages || []).forEach((img: any) => {
                const productId = img.product_id || img.productId;
                if (!productId) return;
                if (!imagesByProductId[productId]) imagesByProductId[productId] = [];
                imagesByProductId[productId].push({
                  id: img.id,
                  productId,
                  imageUrl: img.image_url || img.imageUrl || '',
                  displayOrder: img.display_order ?? img.displayOrder ?? 0,
                  isPrimary: img.is_primary ?? img.isPrimary ?? false
                });
              });

              const authoritativeProducts: ProductItem[] = directProducts.map((item: any) => {
                const relationalImages = imagesByProductId[item.id] || [];
                const primaryRelational = relationalImages.find((img: any) => img.isPrimary)?.imageUrl || relationalImages[0]?.imageUrl || '';
                const primaryImage = item.image || item.image_url || primaryRelational || '';
                const gallery = Array.isArray(item.gallery) ? item.gallery.filter(Boolean) : [];
                const images = Array.isArray(item.images) ? item.images.filter(Boolean) : [];

                return {
                  id: item.id,
                  name: item.name || item.title || '',
                  logoText: item.logoText || item.logo_text || '',
                  logoUrl: item.logoUrl || item.logo_url || '',
                  title: item.title || item.name || '',
                  description: item.description || '',
                  features: Array.isArray(item.features) ? item.features : [],
                  gallery,
                  images: images.length ? images : (primaryImage ? [primaryImage, ...gallery] : gallery),
                  productImages: relationalImages,
                  category: item.category || '',
                  status: item.status || 'Active',
                  featured: item.featured ?? item.is_featured ?? false,
                  displayOrder: Number.isFinite(Number(item.displayOrder))
                    ? Number(item.displayOrder)
                    : (Number.isFinite(Number(item.display_order)) ? Number(item.display_order) : 0),
                  image: primaryImage
                } as ProductItem;
              });

              authoritativeProducts.sort((a, b) => {
                const ao = Number.isFinite(Number(a.displayOrder)) ? Number(a.displayOrder) : Number.MAX_SAFE_INTEGER;
                const bo = Number.isFinite(Number(b.displayOrder)) ? Number(b.displayOrder) : Number.MAX_SAFE_INTEGER;
                if (ao !== bo) return ao - bo;
                return String(a.id || '').localeCompare(String(b.id || ''));
              });

              setProducts(authoritativeProducts);
              dbStore.saveProducts(authoritativeProducts);
            }
          } catch (directProductLoadError) {
            console.warn('[Products] Direct authoritative load failed; keeping existing sync data.', directProductLoadError);
          }
        }"""
          if old not in source:
              raise SystemExit('Expected product loading line was not found; aborting without changes.')
          p.write_text(source.replace(old, new, 1))
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --quiet && echo 'No changes needed.' || git commit -m 'Fix authoritative product loading' && git push