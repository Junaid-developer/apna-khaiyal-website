name: Fix Application Save Now
on:
  push:
    paths:
      - '.github/workflows/fix-application-save-now.yml'
      - '.github/workflows/trigger-application-fix.txt'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch application persistence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # App: persist only the newly submitted application. Never treat the
          # current React array as an authoritative database snapshot.
          p = Path('src/App.tsx')
          s = p.read_text()
          old = """  const handleSaveApplications = (data: JobApplication[]) => {\n    setApplications(data);\n    dbStore.saveApplications(data);\n  };"""
          new = """  const handleSaveApplications = async (data: JobApplication[]) => {\n    await dbStore.saveApplications(data);\n    setApplications(data);\n  };"""
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          # Careers: wait for the save callback before showing success. This
          # prevents a submission from appearing successful and then vanishing
          # after refresh when persistence failed.
          p = Path('src/components/CareersView.tsx')
          s = p.read_text()
          s = s.replace("onAddApplication: (app: JobApplication) => void;", "onAddApplication: (app: JobApplication) => void | Promise<void>;")
          s = s.replace("onAddApplication: (app: JobApplication) => void", "onAddApplication: (app: JobApplication) => void | Promise<void>")
          old_submit = """  const handleFormSubmit = (e: FormEvent) => {\n    e.preventDefault();\n    if (!fullName || !email || !phone || !resumeBase64) {"""
          new_submit = """  const handleFormSubmit = async (e: FormEvent) => {\n    e.preventDefault();\n    if (!fullName || !email || !phone || !resumeBase64) {"""
          s = s.replace(old_submit, new_submit, 1)
          s = s.replace("    onAddApplication(newApp);\n    setFormSubmitted(true);", "    try {\n      await onAddApplication(newApp);\n      setFormSubmitted(true);\n      setFormError('');\n    } catch (error) {\n      console.error('[Careers] Application submission failed:', error);\n      setFormError('Unable to submit your application right now. Please try again.');\n      return;\n    }")
          # Remove the old duplicate clear after the new try/catch.
          s = s.replace("    setFormError('');\n  };\n\n  return (", "  };\n\n  return (", 1)
          p.write_text(s)
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/components/CareersView.tsx
          git diff --cached --quiet || git commit -m 'fix: persist job applications before success'
          git push
          git rm .github/workflows/fix-application-save-now.yml || true
          git rm .github/workflows/trigger-application-fix.txt || true
          git diff --cached --quiet || git commit -m 'chore: remove one-time application fix workflow'
          git push || true
