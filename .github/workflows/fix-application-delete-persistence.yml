name: Fix Application Delete Persistence
on:
  push:
    paths:
      - '.github/workflows/fix-application-delete-persistence.yml'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch saveApplications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/lib/db.ts')
          s=p.read_text()
          pattern=r"  getApplications: \(\): JobApplication\[\] => getStored\('applications', \[\]\),\n  saveApplications: \(items: JobApplication\[\]\) => \{.*?\n  \},(?=\n\s*getMessages:)"
          replacement="""  getApplications: (): JobApplication[] => getStored('applications', []),
  saveApplications: async (items: JobApplication[]) => {
    const applications = Array.isArray(items) ? items : [];
    setStored('applications', applications);
    if (!supabase) return;
    try {
      const { data: existing, error: existingErr } = await supabase.from('job_applications').select('id');
      if (existingErr) throw existingErr;
      const incomingIds = new Set(applications.map((item: any) => item.id).filter(Boolean));
      const removedIds = (existing || []).map((row: any) => row.id).filter((id: string) => !incomingIds.has(id));
      if (removedIds.length) {
        const { error: deleteErr } = await supabase.from('job_applications').delete().in('id', removedIds);
        if (deleteErr) throw deleteErr;
      }
      await syncTableToSupabase('job_applications', applications);
    } catch (err) {
      console.error('[Job Applications] save/delete sync failed:', err);
    }
  },"""
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('saveApplications block not found')
          p.write_text(s)
          print('patched saveApplications')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/db.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Persist job application deletions'
          git push