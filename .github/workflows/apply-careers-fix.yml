name: Apply Careers persistence fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Careers persistence
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/db.ts')
          s = p.read_text()
          start_marker = "  saveCareers:"
          end_marker = "\n  getApplications:"
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate saveCareers block')
          new_block = '''  saveCareers: async (items: CareerOpportunity[]) => {
    // Dedicated careers table is authoritative. Never merge with legacy settings,
    // because doing so resurrects records that the admin just deleted.
    const incoming = Array.isArray(items) ? items.filter((job: any) => job?.id) : [];

    if (supabase && isSupabaseConfigured) {
      const { data: existing, error: existingErr } = await supabase.from('careers').select('id');
      if (existingErr) throw existingErr;

      const incomingIds = incoming.map((job: any) => job.id);
      const removedIds = (existing || []).map((row: any) => row.id).filter((id: string) => !incomingIds.includes(id));
      if (removedIds.length) {
        const { error: deleteErr } = await supabase.from('careers').delete().in('id', removedIds);
        if (deleteErr) throw deleteErr;
      }

      if (incoming.length) {
        const rows = incoming.map((job: any, index: number) => ({
          id: job.id,
          title: job.title || '',
          department: job.department || 'General',
          location: job.location || '',
          type: job.type || 'job',
          experience: job.experience || '',
          description: job.description || '',
          requirements: Array.isArray(job.requirements) ? job.requirements : [],
          responsibilities: Array.isArray(job.responsibilities) ? job.responsibilities : [],
          benefits: Array.isArray(job.benefits) ? job.benefits : [],
          is_active: job.active !== false,
          active: job.active !== false,
          isActive: job.active !== false,
          displayOrder: job.displayOrder ?? index + 1,
          updated_at: new Date().toISOString()
        }));
        const { error: upsertErr } = await supabase.from('careers').upsert(rows, { onConflict: 'id' });
        if (upsertErr) throw upsertErr;
      }
    }

    setStored('careers', incoming);
    return incoming;
  },'''
          s = s[:start] + new_block + s[end:]
          p.write_text(s)
          PY
          git diff --check
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/db.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: prevent careers resurrection after delete"
          git push
