name: Fix Careers Sync
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'src/lib/db.ts';
            let s = fs.readFileSync(path, 'utf8');
            const old = `    // Store all combined settings\n    Object.keys(combinedSettingsMap).forEach((key) => {\n      setStored(key, combinedSettingsMap[key]);\n      result[key] = combinedSettingsMap[key];\n    });`;
            const neu = `    // Store combined settings, but NEVER overwrite the authoritative careers result.\n    // Careers are loaded from the dedicated careers table above and may be more complete\n    // than legacy website_settings/site_settings mirrors.\n    Object.keys(combinedSettingsMap).forEach((key) => {\n      if (key === 'careers') return;\n      setStored(key, combinedSettingsMap[key]);\n      result[key] = combinedSettingsMap[key];\n    });`;
            if (!s.includes(old)) throw new Error('Target careers overwrite block not found');
            s = s.replace(old, neu);
            fs.writeFileSync(path, s);
            const { data: current } = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
            const content = Buffer.from(s).toString('base64');
            await github.rest.repos.createOrUpdateFileContents({owner: context.repo.owner, repo: context.repo.repo, path, message: 'fix careers authoritative result overwrite', content, sha: current.sha, branch: 'main'});
      - uses: actions/github-script@v7
        with:
          script: |
            const path = '.github/workflows/fix-careers-final.yml';
            const { data } = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
            await github.rest.repos.deleteFile({owner: context.repo.owner, repo: context.repo.repo, path, message: 'remove one-time careers fix workflow', sha: data.sha, branch: 'main'});
