name: Apply Careers persistence fix
on:
  push:
    branches: [fix-careers-persistence-20260827]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Careers patch
        run: python .github/scripts/apply-careers-fix.py
      - name: Verify scope
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/components/CareersView.tsx src/lib/db.ts "
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-careers-fix-once.yml .github/scripts/apply-careers-fix.py
          git add src/lib/db.ts src/components/CareersView.tsx .github/workflows/apply-careers-fix-once.yml .github/scripts/apply-careers-fix.py
          git commit -m "Fix Careers persistence and refresh handling"
          git push origin HEAD:fix-careers-persistence-20260827
