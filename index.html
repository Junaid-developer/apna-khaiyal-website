<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="shortcut icon" type="image/jpeg" href="/favicon.jpg" />
    <title>ApnaKhaiyal SMC Pvt Ltd | Enterprise Software & AI Solutions</title>
    <style>
      /* Home > Our Expertise: lightweight rendering override.
         premium-card normally uses backdrop-filter blur + a heavy shadow,
         which is unnecessarily expensive for this small teaser grid. */
      #home-services-teaser .premium-card {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        box-shadow: 0 6px 18px -10px rgba(0, 0, 0, 0.28) !important;
        contain: layout paint style;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // The app uses a lightweight custom router. When a public route is
      // opened directly, activate the matching React view after mount.
      (() => {
        const publicRoutes = new Set([
          '/about', '/services', '/products', '/gallery',
          '/team', '/careers', '/contact'
        ]);
        const path = window.location.pathname.replace(/\/$/, '') || '/';
        if (!publicRoutes.has(path)) return;

        const tab = path.slice(1);
        let attempts = 0;
        const timer = setInterval(() => {
          const link = document.getElementById(`nav-link-${tab}`) || document.getElementById(`mobile-link-${tab}`);
          if (link) {
            clearInterval(timer);
            link.click();
          } else if (++attempts > 100) {
            clearInterval(timer);
          }
        }, 50);
      })();
    </script>
  </body>
</html>
